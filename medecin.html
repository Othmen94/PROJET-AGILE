<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PostOp Suivi — Espace Médecin</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--navy:#0A1628;--navy-mid:#0F2040;--blue:#1B4FD8;--blue-light:#2E6AF6;--cyan:#00C2C7;--white:#F8FAFF;--grey:#8A9BB5;--card-bg:#101E38;--success:#22C55E;--danger:#EF4444;--warning:#F59E0B;}
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{font-family:'DM Sans',sans-serif;background:var(--navy);color:var(--white);min-height:100vh;}

  nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:1rem 5%;background:rgba(10,22,40,0.95);backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,255,255,0.06);}
  .logo{display:flex;align-items:center;gap:9px;font-family:'DM Serif Display',serif;font-size:1.2rem;}
  .logo-icon{width:32px;height:32px;background:var(--blue);border-radius:9px;display:flex;align-items:center;justify-content:center;}
  .logo-icon svg{width:17px;height:17px;}
  .nav-right{display:flex;align-items:center;gap:1rem;}
  .badge-alert{background:var(--danger);color:#fff;font-size:.72rem;font-weight:700;padding:.2rem .55rem;border-radius:100px;display:none;}
  .nav-link{color:var(--grey);text-decoration:none;font-size:.85rem;padding:.4rem .9rem;border-radius:7px;border:1px solid rgba(255,255,255,0.1);transition:all .2s;}
  .nav-link:hover{color:var(--white);border-color:rgba(255,255,255,0.3);}
  .refresh-btn{background:rgba(27,79,216,0.2);border:1px solid rgba(27,79,216,0.4);color:var(--cyan);font-size:.82rem;padding:.4rem .9rem;border-radius:7px;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .2s;}
  .refresh-btn:hover{background:rgba(27,79,216,0.35);}

  .main{max-width:1100px;margin:0 auto;padding:6rem 2rem 4rem;}
  .page-title{margin-bottom:2rem;}
  .page-title h1{font-family:'DM Serif Display',serif;font-size:2rem;margin-bottom:.3rem;}
  .page-title p{color:var(--grey);font-size:.88rem;}

  /* STATS */
  .stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;margin-bottom:2rem;}
  .stat-card{background:var(--card-bg);border:1px solid rgba(255,255,255,0.08);border-radius:16px;padding:1.3rem 1.5rem;}
  .stat-card .num{font-family:'DM Serif Display',serif;font-size:2rem;line-height:1;margin-bottom:.3rem;}
  .stat-card .lbl{font-size:.78rem;color:var(--grey);}
  .stat-card.danger-card{border-color:rgba(239,68,68,0.3);background:rgba(239,68,68,0.06);}
  .stat-card.danger-card .num{color:var(--danger);}

  /* TABS */
  .tabs{display:flex;gap:.5rem;margin-bottom:1.5rem;flex-wrap:wrap;}
  .tab{padding:.6rem 1.1rem;border-radius:100px;border:1px solid rgba(255,255,255,0.1);background:transparent;color:var(--grey);font-size:.83rem;font-weight:500;cursor:pointer;transition:all .2s;font-family:'DM Sans',sans-serif;display:flex;align-items:center;gap:.4rem;}
  .tab.active{background:var(--blue);border-color:var(--blue);color:#fff;}
  .tab:hover:not(.active){border-color:rgba(255,255,255,0.3);color:var(--white);}
  .tab .count{background:rgba(255,255,255,0.2);border-radius:100px;padding:.05rem .45rem;font-size:.72rem;font-weight:700;}
  .tab.active .count{background:rgba(255,255,255,0.25);}

  .panel{display:none;}
  .panel.active{display:block;}

  /* TABLE */
  .table-wrap{background:var(--card-bg);border:1px solid rgba(255,255,255,0.08);border-radius:18px;overflow:hidden;}
  table{width:100%;border-collapse:collapse;}
  th{font-size:.75rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--grey);padding:.9rem 1.2rem;text-align:left;border-bottom:1px solid rgba(255,255,255,0.06);background:rgba(255,255,255,0.02);}
  td{padding:.85rem 1.2rem;font-size:.85rem;border-bottom:1px solid rgba(255,255,255,0.04);}
  tr:last-child td{border-bottom:none;}
  tr:hover td{background:rgba(255,255,255,0.02);}
  .empty{text-align:center;padding:3rem;color:var(--grey);font-size:.88rem;}

  /* BADGES */
  .badge{display:inline-block;font-size:.72rem;font-weight:600;padding:.2rem .6rem;border-radius:100px;}
  .badge.danger{background:rgba(239,68,68,0.15);color:#FCA5A5;border:1px solid rgba(239,68,68,0.3);}
  .badge.warning{background:rgba(245,158,11,0.15);color:#FDE68A;border:1px solid rgba(245,158,11,0.3);}
  .badge.ok{background:rgba(34,197,94,0.12);color:#86EFAC;border:1px solid rgba(34,197,94,0.25);}
  .badge.info{background:rgba(27,79,216,0.15);color:#93C5FD;border:1px solid rgba(27,79,216,0.3);}

  /* ALERT ACTIONS */
  .lu-btn{background:transparent;border:1px solid rgba(255,255,255,0.12);color:var(--grey);font-size:.75rem;padding:.25rem .65rem;border-radius:6px;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .2s;}
  .lu-btn:hover{border-color:var(--success);color:var(--success);}
  .lu-badge{font-size:.72rem;color:var(--success);}

  /* PHOTOS */
  .photos-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:1rem;}
  .photo-card{background:var(--card-bg);border:1px solid rgba(255,255,255,0.08);border-radius:14px;overflow:hidden;}
  .photo-card img{width:100%;height:150px;object-fit:cover;display:block;}
  .photo-info{padding:.9rem;}
  .photo-info strong{font-size:.85rem;display:block;margin-bottom:.2rem;}
  .photo-info span{font-size:.75rem;color:var(--grey);}
  .photo-msg{font-size:.78rem;color:var(--grey);margin-top:.4rem;font-style:italic;}

  /* SPINNER */
  .spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,0.2);border-top-color:var(--cyan);border-radius:50%;animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  @keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
  .fade-in{animation:fadeIn .4s ease both;}

  .loading-row td{text-align:center;padding:2.5rem;color:var(--grey);}

  @media(max-width:800px){.stats-grid{grid-template-columns:1fr 1fr;}.photos-grid{grid-template-columns:1fr 1fr;}}
  @media(max-width:500px){.stats-grid{grid-template-columns:1fr;}}
</style>
</head>
<body>

<nav>
  <div class="logo">
    <div class="logo-icon">
      <svg fill="none" viewBox="0 0 24 24" stroke="#fff" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/>
      </svg>
    </div>
    PostOp Suivi — Dr. Tony Chopper
  </div>
  <div class="nav-right">
    <span class="badge-alert" id="badge-alert">0 alertes</span>
    <button class="refresh-btn" onclick="loadAll()">↻ Actualiser</button>
    <a href="/patient.html" class="nav-link">👤 Espace patient</a>
  </div>
</nav>

<div class="main fade-in">
  <div class="page-title">
    <h1> Tableau de bord médecin</h1>
    <p id="last-update">Chargement en cours…</p>
  </div>

  <!-- STATS -->
  <div class="stats-grid">
    <div class="stat-card danger-card"><div class="num" id="st-alertes">–</div><div class="lbl">Alertes non lues</div></div>
    <div class="stat-card"><div class="num" id="st-questionnaires">–</div><div class="lbl">Questionnaires reçus</div></div>
    <div class="stat-card"><div class="num" id="st-photos">–</div><div class="lbl">Photos reçues</div></div>
    <div class="stat-card"><div class="num" id="st-messages">–</div><div class="lbl">Messages patients</div></div>
  </div>

  <!-- TABS -->
  <div class="tabs">
    <button class="tab active" onclick="switchTab('alertes',this)">🔔 Alertes <span class="count" id="c-alertes">0</span></button>
    <button class="tab" onclick="switchTab('questionnaires',this)">📋 Questionnaires <span class="count" id="c-q">0</span></button>
    <button class="tab" onclick="switchTab('photos',this)">📸 Photos <span class="count" id="c-photos">0</span></button>
    <button class="tab" onclick="switchTab('messages',this)">💬 Messages <span class="count" id="c-messages">0</span></button>
  </div>

  <!-- ALERTES -->
  <div class="panel active" id="panel-alertes">
    <div class="table-wrap">
      <table>
        <thead><tr><th>Patient</th><th>Niveau</th><th>Message</th><th>Date</th><th>Statut</th></tr></thead>
        <tbody id="tb-alertes"><tr class="loading-row"><td colspan="5"><span class="spinner"></span></td></tr></tbody>
      </table>
    </div>
  </div>

  <!-- QUESTIONNAIRES -->
  <div class="panel" id="panel-questionnaires">
    <div class="table-wrap">
      <table>
        <thead><tr><th>Patient</th><th>Douleur</th><th>Temp.</th><th>Fatigue</th><th>Plaie</th><th>Risque</th><th>Date</th></tr></thead>
        <tbody id="tb-questionnaires"><tr class="loading-row"><td colspan="7"><span class="spinner"></span></td></tr></tbody>
      </table>
    </div>
  </div>

  <!-- PHOTOS -->
  <div class="panel" id="panel-photos">
    <div class="photos-grid" id="photos-grid"><p style="color:var(--grey);font-size:.88rem;padding:2rem">Chargement…</p></div>
  </div>

  <!-- MESSAGES -->
  <div class="panel" id="panel-messages">
    <div class="table-wrap">
      <table>
        <thead><tr><th>Patient</th><th>Message</th><th>Date</th></tr></thead>
        <tbody id="tb-messages"><tr class="loading-row"><td colspan="3"><span class="spinner"></span></td></tr></tbody>
      </table>
    </div>
  </div>

</div>

<script>

  
var API = '/api';

function switchTab(id, btn) {
  document.querySelectorAll('.panel').forEach(function(p){ p.classList.remove('active'); });
  document.querySelectorAll('.tab').forEach(function(b){ b.classList.remove('active'); });
  document.getElementById('panel-'+id).classList.add('active');
  btn.classList.add('active');
}

function fmtDate(iso) {
  if (!iso) return '–';
  var d = new Date(iso);
  return d.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric'}) + ' ' +
         d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
}

function badgeNiveau(n) {
  if (n==='danger') return '<span class="badge danger">🔴 Critique</span>';
  if (n==='warning') return '<span class="badge warning">🟡 Attention</span>';
  return '<span class="badge ok">🟢 Info</span>';
}

function badgeRisque(r) {
  return r ? '<span class="badge danger">⚠️ Oui</span>' : '<span class="badge ok">✅ Non</span>';
}

async function loadStats() {
  try {
    var res = await fetch(API+'/stats');
    var d = await res.json();
    document.getElementById('st-alertes').textContent = d.alertes_non_lues;
    document.getElementById('st-questionnaires').textContent = d.total_questionnaires;
    document.getElementById('st-photos').textContent = d.photos_recues;
    document.getElementById('st-messages').textContent = d.messages_recus;
    var badge = document.getElementById('badge-alert');
    if (d.alertes_non_lues > 0) {
      badge.style.display='inline-block';
      badge.textContent = d.alertes_non_lues + ' alerte'+(d.alertes_non_lues>1?'s':'');
    } else { badge.style.display='none'; }
  } catch(e) {}
}

async function loadAlertes() {
  var tb = document.getElementById('tb-alertes');
  try {
    var res = await fetch(API+'/alertes');
    var rows = await res.json();
    document.getElementById('c-alertes').textContent = rows.length;
    if (!rows.length) { tb.innerHTML = '<tr><td class="empty" colspan="5">Aucune alerte pour l\'instant.</td></tr>'; return; }
    tb.innerHTML = rows.map(function(r){
      return '<tr>' +
        '<td><strong>'+r.patient_nom+'</strong></td>'+
        '<td>'+badgeNiveau(r.niveau)+'</td>'+
        '<td>'+r.message+'</td>'+
        '<td style="white-space:nowrap;color:var(--grey)">'+fmtDate(r.date)+'</td>'+
        '<td>'+(r.lu
          ? '<span class="lu-badge">✓ Lu</span>'
          : '<button class="lu-btn" onclick="marquerLu('+r.id+')">Marquer lu</button>'
        )+'</td>'+
      '</tr>';
    }).join('');
  } catch(e) { tb.innerHTML = '<tr><td class="empty" colspan="5">❌ Impossible de charger les alertes. Serveur démarré ?</td></tr>'; }
}

async function marquerLu(id) {
  try {
    await fetch(API+'/alertes/'+id+'/lu', { method:'PATCH' });
    loadAlertes(); loadStats();
  } catch(e) {}
}

async function loadQuestionnaires() {
  var tb = document.getElementById('tb-questionnaires');
  try {
    var res = await fetch(API+'/questionnaires');
    var rows = await res.json();
    document.getElementById('c-q').textContent = rows.length;
    if (!rows.length) { tb.innerHTML = '<tr><td class="empty" colspan="7">Aucun questionnaire reçu.</td></tr>'; return; }
    tb.innerHTML = rows.map(function(r){
      return '<tr>'+
        '<td><strong>'+r.patient_nom+'</strong></td>'+
        '<td><span class="badge '+(r.douleur>=4?'danger':r.douleur>=3?'warning':'ok')+'">'+(r.douleur||'–')+'/5</span></td>'+
        '<td>'+(r.temperature==='elevee'?'<span class="badge danger">Élevée</span>':r.temperature==='normale'?'<span class="badge ok">Normale</span>':'<span class="badge info">Incertaine</span>')+'</td>'+
        '<td><span class="badge '+(r.fatigue>=4?'danger':r.fatigue>=3?'warning':'ok')+'">'+(r.fatigue||'–')+'/5</span></td>'+
        '<td>'+(r.plaie==='normale'?'<span class="badge ok">Normale</span>':r.plaie==='rougeur'?'<span class="badge warning">Rougeur</span>':'<span class="badge danger">Écoulement</span>')+'</td>'+
        '<td>'+badgeRisque(r.est_risque)+'</td>'+
        '<td style="white-space:nowrap;color:var(--grey)">'+fmtDate(r.date)+'</td>'+
      '</tr>';
    }).join('');
  } catch(e) { tb.innerHTML = '<tr><td class="empty" colspan="7">❌ Impossible de charger les questionnaires.</td></tr>'; }
}

async function loadPhotos() {
  var grid = document.getElementById('photos-grid');
  try {
    var res = await fetch(API+'/photos');
    var rows = await res.json();
    document.getElementById('c-photos').textContent = rows.length;
    if (!rows.length) { grid.innerHTML = '<p style="color:var(--grey);font-size:.88rem;padding:2rem">Aucune photo reçue.</p>'; return; }
    grid.innerHTML = rows.map(function(r){
      return '<div class="photo-card">'+
        '<img src="/uploads/'+r.fichier+'" alt="Plaie '+r.patient_nom+'" loading="lazy">'+
        '<div class="photo-info">'+
          '<strong>'+r.patient_nom+'</strong>'+
          '<span>'+fmtDate(r.date)+'</span>'+
          (r.message ? '<div class="photo-msg">"'+r.message+'"</div>' : '')+
        '</div>'+
      '</div>';
    }).join('');
  } catch(e) { grid.innerHTML = '<p style="color:var(--grey);font-size:.88rem;padding:2rem">❌ Impossible de charger les photos.</p>'; }
}

async function loadMessages() {
  var tb = document.getElementById('tb-messages');
  try {
    var res = await fetch(API+'/messages');
    var rows = await res.json();
    document.getElementById('c-messages').textContent = rows.length;
    if (!rows.length) { tb.innerHTML = '<tr><td class="empty" colspan="3">Aucun message reçu.</td></tr>'; return; }
    tb.innerHTML = rows.map(function(r){
      return '<tr>'+
        '<td style="white-space:nowrap"><strong>'+r.patient_nom+'</strong></td>'+
        '<td>'+r.contenu+'</td>'+
        '<td style="white-space:nowrap;color:var(--grey)">'+fmtDate(r.date)+'</td>'+
      '</tr>';
    }).join('');
  } catch(e) { tb.innerHTML = '<tr><td class="empty" colspan="3">❌ Impossible de charger les messages.</td></tr>'; }
}

async function loadAll() {
  document.getElementById('last-update').textContent = 'Actualisation…';
  await Promise.all([loadStats(), loadAlertes(), loadQuestionnaires(), loadPhotos(), loadMessages()]);
  document.getElementById('last-update').textContent = 'Dernière mise à jour : ' + new Date().toLocaleTimeString('fr-FR');
}

// Chargement initial + auto-refresh toutes les 30s
loadAll();
setInterval(loadAll, 30000);
</script>
</body>
</html>
